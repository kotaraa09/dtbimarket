<text x="1060" y="52" text-anchor="middle" font-size="12.5" font-weight="700" fill="#9AA1AC" letter-spacing="1.6">THEORY</text>
<text x="1535" y="52" text-anchor="middle" font-size="12.5" font-weight="700" fill="#9AA1AC" letter-spacing="1.6">HYPOTHESIS</text>
<text x="450" y="52" text-anchor="middle" font-size="13" font-style="italic" fill="#C2C7CE">Why?</text>
<text x="860" y="52" text-anchor="middle" font-size="13" font-style="italic" fill="#C2C7CE">Why?</text>
<text x="1260" y="52" text-anchor="middle" font-size="13" font-style="italic" fill="#C2C7CE">How? / Can be?</text>

<text x="240" y="702" text-anchor="middle" font-size="17" font-weight="600" fill="#FFFFFF">Students must run a real</text>
<text x="240" y="726" text-anchor="middle" font-size="17" font-weight="600" fill="#FFFFFF">business and build it a website.</text>
<text x="240" y="750" text-anchor="middle" font-size="17" font-weight="600" fill="#FFFFFF">Almost none go online. The</text>
<text x="240" y="774" text-anchor="middle" font-size="17" font-weight="600" fill="#FFFFFF">business exists on paper, but</text>
<text x="240" y="798" text-anchor="middle" font-size="17" font-weight="600" fill="#FFFFFF">not in the market — so there is</text>
<text x="240" y="822" text-anchor="middle" font-size="17" font-weight="600" fill="#FFFFFF">no data to learn from.</text>
<text x="240" y="875" text-anchor="middle" font-size="12.5" font-style="italic" fill="#9AA1AC">Intervention: a shared storefront, plus an advisor</text>
<text x="240" y="892" text-anchor="middle" font-size="12.5" font-style="italic" fill="#9AA1AC">grounded in the platform's own data.</text>

<g filter="url(#shb)"><rect x="490" y="184.5" width="330" height="101" rx="16" fill="#EEF0FF" stroke="#4F46E5" stroke-width="1.8"/></g>
<circle cx="520" cy="214.5" r="15" fill="#4F46E5"/>
<text x="520" y="220" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">1</text>
<text x="548" y="211.5" font-size="15.5" font-weight="600" fill="#111827">Does an AI advisor build the</text>
<text x="548" y="232.5" font-size="15.5" font-weight="600" fill="#111827">seller's own judgement, or</text>
<text x="548" y="253.5" font-size="15.5" font-weight="600" fill="#111827">replace it?</text>
<g filter="url(#sh)"><rect x="900" y="156" width="320" height="66" rx="13" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5" stroke-opacity="0.85"/></g>
<text x="918" y="182" font-size="15" font-weight="600" fill="#111827">Cognitive offloading &amp; skill decay</text>
<text x="918" y="202" font-size="12.5" font-style="italic" fill="#4F46E5">Bainbridge; Risko &amp; Gilbert</text>
<g filter="url(#sh)"><rect x="1300" y="118" width="470" height="66" rx="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.1" stroke-opacity="0.35"/></g>
<rect x="1300" y="127" width="6" height="48" rx="3" fill="#4F46E5"/>
<text x="1324" y="146" font-size="15" fill="#1F2937">H1.1 In the off weeks, previously advised sellers</text>
<text x="1324" y="167" font-size="15" fill="#1F2937">make fewer unprompted improvements</text>
<g filter="url(#sh)"><rect x="1300" y="194" width="470" height="66" rx="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.1" stroke-opacity="0.35"/></g>
<rect x="1300" y="203" width="6" height="48" rx="3" fill="#4F46E5"/>
<text x="1324" y="222" font-size="15" fill="#1F2937">H1.2 The drop is largest for sellers with no prior</text>
<text x="1324" y="243" font-size="15" fill="#1F2937">business experience</text>
<g filter="url(#sh)"><rect x="900" y="286" width="320" height="66" rx="13" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5" stroke-opacity="0.85"/></g>
<text x="918" y="312" font-size="15" font-weight="600" fill="#111827">Attention narrowing</text>
<text x="918" y="332" font-size="12.5" font-style="italic" fill="#4F46E5">Goodhart; measurement fixation</text>
<g filter="url(#sh)"><rect x="1300" y="286" width="470" height="66" rx="12" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.1" stroke-opacity="0.35"/></g>
<rect x="1300" y="295" width="6" height="48" rx="3" fill="#4F46E5"/>
<text x="1324" y="314" font-size="15" fill="#1F2937">H1.3 Sellers improve what the AI mentions and let</text>
<text x="1324" y="335" font-size="15" fill="#1F2937">unmentioned things drift</text>
<g filter="url(#shb)"><rect x="490" y="431" width="330" height="80" rx="16" fill="#E4F5F2" stroke="#0D9488" stroke-width="1.8"/></g>
<circle cx="520" cy="461" r="15" fill="#0D9488"/>
<text x="520" y="466.5" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">2</text>
<text x="548" y="458" font-size="15.5" font-weight="600" fill="#111827">How much of the work should the</text>
<text x="548" y="479" font-size="15.5" font-weight="600" fill="#111827">AI do for the student?</text>
<g filter="url(#sh)"><rect x="900" y="400" width="320" height="66" rx="13" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.5" stroke-opacity="0.85"/></g>
<text x="918" y="426" font-size="15" font-weight="600" fill="#111827">Effort–compliance</text>
<text x="918" y="446" font-size="12.5" font-style="italic" fill="#0D9488">dual-process accounts</text>
<g filter="url(#sh)"><rect x="1300" y="400" width="470" height="66" rx="12" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.1" stroke-opacity="0.35"/></g>
<rect x="1300" y="409" width="6" height="48" rx="3" fill="#0D9488"/>
<text x="1324" y="428" font-size="15" fill="#1F2937">H2.1 Action rate rises as the AI does more of the</text>
<text x="1324" y="449" font-size="15" fill="#1F2937">work</text>
<g filter="url(#sh)"><rect x="900" y="484" width="320" height="66" rx="13" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.5" stroke-opacity="0.85"/></g>
<text x="918" y="510" font-size="15" font-weight="600" fill="#111827">Psychological ownership</text>
<text x="918" y="530" font-size="12.5" font-style="italic" fill="#0D9488">Pierce, Kostova &amp; Dirks</text>
<g filter="url(#sh)"><rect x="1300" y="492" width="470" height="50" rx="12" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.1" stroke-opacity="0.35"/></g>
<rect x="1300" y="501" width="6" height="32" rx="3" fill="#0D9488"/>
<text x="1324" y="520" font-size="15" fill="#1F2937">H2.2 It reverses for tasks sellers feel are theirs</text>
<g filter="url(#sh)"><rect x="490" y="675" width="330" height="80" rx="16" fill="#F6F7F8" stroke="#9CA3AF" stroke-width="1.2"/></g>
<circle cx="520" cy="705" r="15" fill="#9CA3AF"/>
<text x="520" y="710.5" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">3</text>
<text x="548" y="702" font-size="15.5" font-weight="600" fill="#6B7280">Which kind of information makes</text>
<text x="548" y="723" font-size="15.5" font-weight="600" fill="#6B7280">a seller act?</text>
<g filter="url(#sh)"><rect x="900" y="590" width="320" height="66" rx="13" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1" stroke-opacity="0.5"/></g>
<text x="918" y="616" font-size="15" font-weight="600" fill="#6B7280">Regulatory focus</text>
<text x="918" y="636" font-size="12.5" font-style="italic" fill="#9CA3AF">Higgins</text>
<g filter="url(#sh)"><rect x="1300" y="590" width="470" height="66" rx="12" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.1" stroke-opacity="0.28"/></g>
<rect x="1300" y="599" width="6" height="48" rx="3" fill="#9CA3AF"/>
<text x="1324" y="618" font-size="15" fill="#6B7280">H3.1 Sellers act more on outside opportunity than on</text>
<text x="1324" y="639" font-size="15" fill="#6B7280">criticism of themselves</text>
<g filter="url(#sh)"><rect x="900" y="682" width="320" height="66" rx="13" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1" stroke-opacity="0.5"/></g>
<text x="918" y="708" font-size="15" font-weight="600" fill="#6B7280">Social comparison</text>
<text x="918" y="728" font-size="12.5" font-style="italic" fill="#9CA3AF">Festinger</text>
<g filter="url(#sh)"><rect x="1300" y="682" width="470" height="66" rx="12" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.1" stroke-opacity="0.28"/></g>
<rect x="1300" y="691" width="6" height="48" rx="3" fill="#9CA3AF"/>
<text x="1324" y="710" font-size="15" fill="#6B7280">H3.2 Sellers act more when shown how they compare to</text>
<text x="1324" y="731" font-size="15" fill="#6B7280">similar stores</text>
<g filter="url(#sh)"><rect x="900" y="774" width="320" height="66" rx="13" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1" stroke-opacity="0.5"/></g>
<text x="918" y="800" font-size="15" font-weight="600" fill="#6B7280">Trust calibration</text>
<text x="918" y="820" font-size="12.5" font-style="italic" fill="#9CA3AF">uncertainty communication</text>
<g filter="url(#sh)"><rect x="1300" y="774" width="470" height="66" rx="12" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.1" stroke-opacity="0.28"/></g>
<rect x="1300" y="783" width="6" height="48" rx="3" fill="#9CA3AF"/>
<text x="1324" y="802" font-size="15" fill="#6B7280">H3.3 Advice that admits uncertainty is acted on less</text>
<text x="1324" y="823" font-size="15" fill="#6B7280">at first, dismissed less over time</text>
<g filter="url(#sh)"><rect x="490" y="979" width="330" height="80" rx="16" fill="#F6F7F8" stroke="#9CA3AF" stroke-width="1.2"/></g>
<circle cx="520" cy="1009" r="15" fill="#9CA3AF"/>
<text x="520" y="1014.5" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">4</text>
<text x="548" y="1006" font-size="15.5" font-weight="600" fill="#6B7280">Can current AI models actually</text>
<text x="548" y="1027" font-size="15.5" font-weight="600" fill="#6B7280">advise a micro-business at all?</text>
<g filter="url(#sh)"><rect x="900" y="948" width="320" height="66" rx="13" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1" stroke-opacity="0.5"/></g>
<text x="918" y="974" font-size="15" font-weight="600" fill="#6B7280">Construct validity</text>
<text x="918" y="994" font-size="12.5" font-style="italic" fill="#9CA3AF">Cronbach &amp; Meehl</text>
<g filter="url(#sh)"><rect x="1300" y="888" width="470" height="50" rx="12" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.1" stroke-opacity="0.28"/></g>
<rect x="1300" y="897" width="6" height="32" rx="3" fill="#9CA3AF"/>
<text x="1324" y="916" font-size="15" fill="#6B7280">H4.1 Models state numbers that are not in the data</text>
<g filter="url(#sh)"><rect x="1300" y="948" width="470" height="50" rx="12" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.1" stroke-opacity="0.28"/></g>
<rect x="1300" y="957" width="6" height="32" rx="3" fill="#9CA3AF"/>
<text x="1324" y="976" font-size="15" fill="#6B7280">H4.2 They write well and diagnose badly</text>
<g filter="url(#sh)"><rect x="1300" y="1008" width="470" height="66" rx="12" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.1" stroke-opacity="0.28"/></g>
<rect x="1300" y="1017" width="6" height="48" rx="3" fill="#9CA3AF"/>
<text x="1324" y="1036" font-size="15" fill="#6B7280">H4.4 Exam score does not predict what sellers</text>
<text x="1324" y="1057" font-size="15" fill="#6B7280">actually do</text>
<g filter="url(#sh)"><rect x="900" y="1092" width="320" height="66" rx="13" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1" stroke-opacity="0.5"/></g>
<text x="918" y="1118" font-size="15" font-weight="600" fill="#6B7280">Language coverage</text>
<text x="918" y="1138" font-size="12.5" font-style="italic" fill="#9CA3AF">multilingual model capability</text>
<g filter="url(#sh)"><rect x="1300" y="1100" width="470" height="50" rx="12" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.1" stroke-opacity="0.28"/></g>
<rect x="1300" y="1109" width="6" height="32" rx="3" fill="#9CA3AF"/>
<text x="1324" y="1128" font-size="15" fill="#6B7280">H4.3 Thai models win on language, lose on diagnosis</text>
<g filter="url(#sh)"><rect x="490" y="1237" width="330" height="80" rx="16" fill="#F6F7F8" stroke="#9CA3AF" stroke-width="1.2"/></g>
<circle cx="520" cy="1267" r="15" fill="#9CA3AF"/>
<text x="520" y="1272.5" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">5</text>
<text x="548" y="1264" font-size="15.5" font-weight="600" fill="#6B7280">When every competitor gets the</text>
<text x="548" y="1285" font-size="15.5" font-weight="600" fill="#6B7280">same advice, does anyone gain?</text>
<g filter="url(#sh)"><rect x="900" y="1198" width="320" height="66" rx="13" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1" stroke-opacity="0.5"/></g>
<text x="918" y="1224" font-size="15" font-weight="600" fill="#6B7280">Resource-based view</text>
<text x="918" y="1244" font-size="12.5" font-style="italic" fill="#9CA3AF">Barney</text>
<g filter="url(#sh)"><rect x="1300" y="1198" width="470" height="66" rx="12" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.1" stroke-opacity="0.28"/></g>
<rect x="1300" y="1207" width="6" height="48" rx="3" fill="#9CA3AF"/>
<text x="1324" y="1226" font-size="15" fill="#6B7280">H5.1 A store gains only when few rivals followed the</text>
<text x="1324" y="1247" font-size="15" fill="#6B7280">same advice</text>
<g filter="url(#sh)"><rect x="900" y="1290" width="320" height="66" rx="13" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1" stroke-opacity="0.5"/></g>
<text x="918" y="1316" font-size="15" font-weight="600" fill="#6B7280">Mimetic isomorphism</text>
<text x="918" y="1336" font-size="12.5" font-style="italic" fill="#9CA3AF">DiMaggio &amp; Powell</text>
<g filter="url(#sh)"><rect x="1300" y="1290" width="470" height="66" rx="12" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.1" stroke-opacity="0.28"/></g>
<rect x="1300" y="1299" width="6" height="48" rx="3" fill="#9CA3AF"/>
<text x="1324" y="1318" font-size="15" fill="#6B7280">H5.2 Categories where everyone got the same advice</text>
<text x="1324" y="1339" font-size="15" fill="#6B7280">end up more alike</text>
