# Local development database only.
# The deployed database is a managed Postgres and is decision D-1, still open.
services:
  db:
    image: postgres:17-alpine
    container_name: dtbimarket-db
    environment:
      POSTGRES_USER: dtbi
      POSTGRES_PASSWORD: dtbi_local_dev
      POSTGRES_DB: dtbimarket
    ports:
      - '5433:5432'
    volumes:
      - dtbimarket-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dtbi -d dtbimarket']
      interval: 5s
      timeout: 5s
      retries: 20

  # Local object storage, speaking the S3 API (ADR-0004).
  # In deployment this is a managed S3-compatible bucket; the application code
  # is identical either way, because the only difference is configuration.
  # Ports are shifted off the defaults for the same reason Postgres is on 5433.
  storage:
    image: minio/minio:latest
    container_name: dtbimarket-storage
    command: server /data --console-address ":9001"
    environment:
      # Local development credentials. They protect a container on your laptop
      # and are not secrets (CLAUDE.md rule 9) — the deployed bucket's keys come
      # from the environment and are never in this repository.
      MINIO_ROOT_USER: dtbi_local_dev
      MINIO_ROOT_PASSWORD: dtbi_local_dev_secret
    ports:
      - '9100:9000'
      - '9101:9001'
    volumes:
      - dtbimarket-storage:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: create the bucket. Deliberately NOT done by the application —
  # an app that can create its own bucket in production is an app that can
  # quietly write to the wrong one after a typo in configuration.
  storage-init:
    image: minio/mc:latest
    depends_on:
      storage:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://storage:9000 dtbi_local_dev dtbi_local_dev_secret &&
      mc mb --ignore-existing local/dtbimarket-photos &&
      echo 'bucket ready'
      "

volumes:
  dtbimarket-pgdata:
  dtbimarket-storage:
